name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # El modelo del buscador se descarga una vez y se reutiliza entre builds.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/search-model
          key: search-model-${{ hashFiles('src/scripts/search/config.ts') }}

      - run: npm run build

      - run: npm run check:text
        env:
          TEXT_CHECK_TERMS: ${{ secrets.TEXT_CHECK_TERMS }}

      - run: npx playwright install --with-deps chromium

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
